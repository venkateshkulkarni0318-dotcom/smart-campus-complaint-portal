{% extends "base.html" %}

{% block title %}Sign In — Smart Campus Portal{% endblock %}

{% block auth_content %}
<div class="card shadow-sm border-0">
  <div class="card-body p-4 p-md-5">
    <h4 class="fw-bold text-dark mb-1">Welcome Back</h4>
    <p class="text-muted small mb-4">Sign in to your campus maintenance account</p>

    <form method="POST" action="{{ url_for('auth.login') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="email" class="form-label">Campus Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" class="form-control border-start-0 ps-0" id="email" name="email"
                 placeholder="username@campus.edu" required autofocus>
        </div>
      </div>

      <div class="mb-4">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" class="form-control border-start-0 ps-0" id="password" name="password"
                 placeholder="••••••••" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
        <i class="bi bi-box-arrow-in-right me-1"></i> Sign In
      </button>

      <div class="text-center">
        <span class="text-muted small">Need an account?</span>
        <a href="{{ url_for('auth.register') }}" class="small fw-semibold text-decoration-none text-primary ms-1">
          Register Here
        </a>
      </div>
    </form>
  </div>
</div>

<!-- Quick-Demo Reference Card for Hackathon Judges -->
<div class="card mt-3 border-0 bg-light">
  <div class="card-body p-3">
    <div class="d-flex align-items-center justify-content-between mb-2">
      <span class="badge bg-primary-subtle text-primary fw-semibold px-2 py-1">
        <i class="bi bi-info-circle me-1"></i>Demo Accounts (Click to Fill)
      </span>
      <small class="text-muted">Hackathon Mode</small>
    </div>
    <div class="d-flex flex-wrap gap-1">
      <button type="button" class="btn btn-outline-secondary btn-sm demo-fill"
              data-email="admin@campus.edu" data-pass="Admin@2026!">
        Admin
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm demo-fill"
              data-email="electrical.staff@campus.edu" data-pass="Staff@2026!">
        Staff (Elec)
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm demo-fill"
              data-email="student@campus.edu" data-pass="Student@2026!">
        Student
      </button>
      <button type="button" class="btn btn-outline-secondary btn-sm demo-fill"
              data-email="faculty@campus.edu" data-pass="Faculty@2026!">
        Faculty
      </button>
    </div>
  </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
  document.querySelectorAll('.demo-fill').forEach(btn => {
    btn.addEventListener('click', function() {
      document.getElementById('email').value = this.dataset.email;
      document.getElementById('password').value = this.dataset.pass;
    });
  });
</script>
{% endblock %}
