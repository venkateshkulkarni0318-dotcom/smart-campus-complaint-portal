{% extends "base.html" %}

{% block title %}Create Account — Smart Campus Portal{% endblock %}

{% block auth_content %}
<div class="card shadow-sm border-0">
  <div class="card-body p-4 p-md-5">
    <h4 class="fw-bold text-dark mb-1">Create an Account</h4>
    <p class="text-muted small mb-4">Register as a student or faculty member</p>

    <form method="POST" action="{{ url_for('auth.register') }}">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <div class="mb-3">
        <label for="name" class="form-label">Full Name</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-person"></i>
          </span>
          <input type="text" class="form-control border-start-0 ps-0" id="name" name="name"
                 placeholder="e.g. Aditya Sharma" required autofocus>
        </div>
      </div>

      <div class="mb-3">
        <label for="email" class="form-label">Campus Email</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-envelope"></i>
          </span>
          <input type="email" class="form-control border-start-0 ps-0" id="email" name="email"
                 placeholder="name@campus.edu" required>
        </div>
      </div>

      <div class="mb-3">
        <label for="role" class="form-label">Campus Role</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-person-badge"></i>
          </span>
          <select class="form-select border-start-0 ps-0" id="role" name="role" required>
            <option value="student" selected>Student</option>
            <option value="faculty">Faculty Member</option>
          </select>
        </div>
        <div class="form-text text-muted" style="font-size: 0.75rem;">
          <i class="bi bi-shield-check me-1"></i>Administrative and staff accounts are provisioned by campus IT.
        </div>
      </div>

      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-lock"></i>
          </span>
          <input type="password" class="form-control border-start-0 ps-0" id="password" name="password"
                 placeholder="Minimum 8 characters" minlength="8" required>
        </div>
      </div>

      <div class="mb-4">
        <label for="confirm_password" class="form-label">Confirm Password</label>
        <div class="input-group">
          <span class="input-group-text bg-light text-muted border-end-0">
            <i class="bi bi-shield-lock"></i>
          </span>
          <input type="password" class="form-control border-start-0 ps-0" id="confirm_password" name="confirm_password"
                 placeholder="Re-enter password" minlength="8" required>
        </div>
      </div>

      <button type="submit" class="btn btn-primary w-100 py-2 mb-3">
        <i class="bi bi-person-plus me-1"></i> Register Account
      </button>

      <div class="text-center">
        <span class="text-muted small">Already registered?</span>
        <a href="{{ url_for('auth.login') }}" class="small fw-semibold text-decoration-none text-primary ms-1">
          Sign In Here
        </a>
      </div>
    </form>
  </div>
</div>
{% endblock %}
